name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: 🔧 Install npm dependencies
        run: npm ci

      - name: 🏗️ Prebuild Expo (Generate Android project)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build APK via Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArmoryVault-Companion-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Build
          body: "Automated build of the latest commit on main."
          files: android/app/build/outputs/apk/release/app-release.apk
