name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🏷️ Determine App Version
        id: app-version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Determined version: $VERSION (versionCode: $VERSION_CODE)"

      - name: 🏗️ Generate Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: 🔑 Ensure Keystore Exists
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating debug keystore for build..."
            keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🔨 Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures="arm64-v8a,armeabi-v7a,x86_64" --no-daemon

      - name: 🔍 Verify Output APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            ls -lh "$APK_PATH"
          else
            echo "❌ Error: Expected APK not found at $APK_PATH"
            exit 1
          fi

      - name: 📤 Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmoryVault-Companion-${{ steps.app-version.outputs.version }}-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: 🚀 Publish Release & APK to GitHub Releases Tab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.app-version.outputs.version }}"
          VERSION_CODE="${{ steps.app-version.outputs.version_code }}"
          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          RELEASE_ASSET="ArmoryVault-Companion-${VERSION}.apk"

          echo "Preparing release asset: $RELEASE_ASSET"
          cp "$APK_FILE" "$RELEASE_ASSET"

          # Generate cryptographic checksum
          sha256sum "$RELEASE_ASSET" "$APK_FILE" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Uploading APK and checksum assets..."
            gh release upload "$VERSION" "$RELEASE_ASSET" "$APK_FILE" SHA256SUMS.txt --clobber
          else
            echo "Release $VERSION does not exist yet. Creating release and publishing assets..."
            gh release create "$VERSION" "$RELEASE_ASSET" "$APK_FILE" SHA256SUMS.txt \
              --title "ArmoryVault Companion $VERSION" \
              --generate-notes
          fi
          echo "✅ Release $VERSION published successfully with $RELEASE_ASSET and SHA256SUMS.txt on the Release tab!"
