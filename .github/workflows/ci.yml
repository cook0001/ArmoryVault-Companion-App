name: Continuous Integration

on:
  push:
    branches: [main, master, stable]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main, master, stable]
    paths-ignore:
      - '*.md'

permissions:
  contents: read

jobs:
  validate:
    name: Test, Typecheck & Preflight
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🧪 Run Unit Tests (Jest)
        run: npm test

      - name: 🔎 TypeScript Verification
        run: npx tsc --noEmit

      - name: 🚀 Run Pre-Flight Build Validation
        run: bash preflight.sh
